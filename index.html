      (function () {
        var SUPA = 'https://hhzcoijhvvlmtazlmiei.supabase.co';
        var ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhoemNvaWpodnZsbXRhemxtaWVpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcxNDU0OTEsImV4cCI6MjA5MjcyMTQ5MX0.TPDIuIfAPMIb7vC6Qw8P0y--xUTWKXPjzQwkUiWjHV0';
        var host = location.hostname;
        var prodHost = (host === 'staticvibes.site' || host === 'www.staticvibes.site');
        function toFastUrl(u) {
          if (!u) return u;
          if (prodHost) {
            u = u.replace(/^https?:\/\/[a-z0-9-]+\.supabase\.(?:co|in)\/storage\/v1\/object\/public\//i, '/img/');
            var w = window.innerWidth < 768 ? 828 : 1600;
            u += (u.indexOf('?') > -1 ? '&' : '?') + 'width=' + w + '&quality=70&format=webp&resize=contain';
          }
          return u;
        }
        function preload(url) {
          if (!url) return;
          var l = document.createElement('link');
          l.rel = 'preload'; l.as = 'image'; l.href = url; l.fetchPriority = 'high';
          document.head.appendChild(l);
        }
        // 1) Instant preload from local cache (repeat visits)
        try {
          var raw = localStorage.getItem('sv_banners');
          if (raw) {
            var list = JSON.parse(raw);
            if (list && list[0] && list[0].image_url) preload(toFastUrl(list[0].image_url));
          }
        } catch (e) {}
        // 2) First-visit: fire banner fetch in parallel with the JS bundle so the
        //    image starts downloading before React even mounts.
        try {
          fetch(SUPA + '/rest/v1/banners?select=id,image_url,button_link,is_active,display_order&is_active=eq.true&order=display_order.asc', {
            headers: { apikey: ANON, Authorization: 'Bearer ' + ANON }
          })
            .then(function (r) { return r.ok ? r.json() : null; })
            .then(function (list) {
              if (!list || !list.length) return;
              try {
                localStorage.setItem('sv_banners', JSON.stringify(list));
                sessionStorage.setItem('sv_banners', JSON.stringify(list));
              } catch (e) {}
              preload(toFastUrl(list[0].image_url));
            }).catch(function () {});
        } catch (e) {}
      })();
    </script>
